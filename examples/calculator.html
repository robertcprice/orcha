<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .calculator {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .display {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
            position: relative;
            min-height: 100px;
        }

        .previous-operand {
            color: #888;
            font-size: 18px;
            margin-bottom: 5px;
            min-height: 24px;
        }

        .current-operand {
            color: #fff;
            font-size: 36px;
            font-weight: 300;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 48px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            background: #3d3d3d;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background: #4d4d4d;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.operator {
            background: #5a5a5a;
        }

        button.operator:hover {
            background: #6a6a6a;
        }

        button.equals {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            grid-column: span 2;
        }

        button.equals:hover {
            background: linear-gradient(135deg, #7688ec 0%, #8659b4 100%);
        }

        button.clear {
            background: #e74c3c;
        }

        button.clear:hover {
            background: #f55c4c;
        }

        button.delete {
            background: #e67e22;
        }

        button.delete:hover {
            background: #f68e32;
        }

        button.zero {
            grid-column: span 2;
        }

        /* Responsive design */
        @media (max-width: 400px) {
            .calculator {
                padding: 15px;
            }

            button {
                padding: 20px;
                font-size: 18px;
            }

            .current-operand {
                font-size: 30px;
            }
        }

        /* Accessibility */
        button:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        /* Animation for button press */
        @keyframes buttonPress {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        button.pressed {
            animation: buttonPress 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="calculator.clear()">AC</button>
            <button class="delete" onclick="calculator.delete()">DEL</button>
            <button class="operator" onclick="calculator.chooseOperation('÷')">÷</button>
            <button class="operator" onclick="calculator.chooseOperation('×')">×</button>

            <button onclick="calculator.appendNumber('7')">7</button>
            <button onclick="calculator.appendNumber('8')">8</button>
            <button onclick="calculator.appendNumber('9')">9</button>
            <button class="operator" onclick="calculator.chooseOperation('-')">-</button>

            <button onclick="calculator.appendNumber('4')">4</button>
            <button onclick="calculator.appendNumber('5')">5</button>
            <button onclick="calculator.appendNumber('6')">6</button>
            <button class="operator" onclick="calculator.chooseOperation('+')">+</button>

            <button onclick="calculator.appendNumber('1')">1</button>
            <button onclick="calculator.appendNumber('2')">2</button>
            <button onclick="calculator.appendNumber('3')">3</button>
            <button onclick="calculator.appendNumber('.')">.</button>

            <button class="zero" onclick="calculator.appendNumber('0')">0</button>
            <button class="equals" onclick="calculator.compute()">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
                this.updateDisplay();
            }

            delete() {
                if (this.currentOperand === '0') return;
                if (this.currentOperand.length === 1) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.slice(0, -1);
                }
                this.updateDisplay();
            }

            appendNumber(number) {
                // Handle decimal point
                if (number === '.' && this.currentOperand.includes('.')) return;

                // Handle leading zero
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number;
                } else if (this.shouldResetScreen) {
                    this.currentOperand = number === '.' ? '0.' : number;
                    this.shouldResetScreen = false;
                } else {
                    // Limit input length to prevent overflow
                    if (this.currentOperand.length >= 15) return;
                    this.currentOperand += number;
                }

                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;

                if (this.previousOperand !== '') {
                    this.compute(false);
                }

                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            compute(showResult = true) {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            this.currentOperand = 'Error: Division by zero';
                            this.previousOperand = '';
                            this.operation = undefined;
                            this.shouldResetScreen = true;
                            this.updateDisplay();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // Format the result
                if (computation !== undefined) {
                    // Handle very large or very small numbers
                    if (Math.abs(computation) > 999999999999999 ||
                        (Math.abs(computation) < 0.000001 && computation !== 0)) {
                        this.currentOperand = computation.toExponential(6);
                    } else {
                        // Round to avoid floating point errors
                        this.currentOperand = Math.round(computation * 100000000) / 100000000;
                        this.currentOperand = this.currentOperand.toString();
                    }

                    if (showResult) {
                        this.operation = undefined;
                        this.previousOperand = '';
                        this.shouldResetScreen = true;
                    } else {
                        this.previousOperand = this.currentOperand;
                    }
                }

                this.updateDisplay();
            }

            getDisplayNumber(number) {
                const stringNumber = number.toString();

                // Handle error messages
                if (stringNumber.includes('Error')) return stringNumber;

                // Handle exponential notation
                if (stringNumber.includes('e')) return stringNumber;

                const parts = stringNumber.split('.');
                let integerDisplay = parts[0];

                // Add thousand separators
                if (!isNaN(integerDisplay)) {
                    integerDisplay = parseInt(integerDisplay).toLocaleString('en');
                }

                if (parts.length > 1) {
                    return integerDisplay + '.' + parts[1];
                }

                return integerDisplay;
            }

            updateDisplay() {
                this.currentOperandElement.innerText = this.getDisplayNumber(this.currentOperand);

                if (this.operation != null && this.previousOperand !== '') {
                    this.previousOperandElement.innerText =
                        `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }

        // Initialize calculator
        const calculator = new Calculator(
            document.getElementById('previousOperand'),
            document.getElementById('currentOperand')
        );

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            // Prevent default behavior for calculator keys
            if (['+', '-', '*', '/', '.', 'Enter', 'Backspace', 'Escape'].includes(e.key) ||
                (e.key >= '0' && e.key <= '9')) {
                e.preventDefault();
            }

            // Number keys
            if (e.key >= '0' && e.key <= '9') {
                calculator.appendNumber(e.key);
                animateButtonPress(e.key);
            }

            // Decimal point
            if (e.key === '.') {
                calculator.appendNumber('.');
                animateButtonPress('.');
            }

            // Operations
            if (e.key === '+') {
                calculator.chooseOperation('+');
                animateButtonPress('+');
            }
            if (e.key === '-') {
                calculator.chooseOperation('-');
                animateButtonPress('-');
            }
            if (e.key === '*') {
                calculator.chooseOperation('×');
                animateButtonPress('×');
            }
            if (e.key === '/') {
                calculator.chooseOperation('÷');
                animateButtonPress('÷');
            }

            // Enter key for equals
            if (e.key === 'Enter' || e.key === '=') {
                calculator.compute();
                animateButtonPress('=');
            }

            // Backspace for delete
            if (e.key === 'Backspace') {
                calculator.delete();
                animateButtonPress('DEL');
            }

            // Escape for clear
            if (e.key === 'Escape') {
                calculator.clear();
                animateButtonPress('AC');
            }
        });

        // Visual feedback for keyboard presses
        function animateButtonPress(key) {
            let button;

            // Map keyboard keys to button text
            const keyMap = {
                '×': '×',
                '÷': '÷',
                'Enter': '=',
                'Backspace': 'DEL',
                'Escape': 'AC'
            };

            const searchKey = keyMap[key] || key;

            // Find the button with matching text
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                if (btn.textContent === searchKey) {
                    button = btn;
                }
            });

            if (button) {
                button.classList.add('pressed');
                setTimeout(() => {
                    button.classList.remove('pressed');
                }, 150);
            }
        }

        // Add click animation to all buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.add('pressed');
                setTimeout(() => {
                    this.classList.remove('pressed');
                }, 150);
            });
        });
    </script>
</body>
</html>
